name: Build MC3DS Cheat Engine (.3gx)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch CTRPluginFramework template files
        run: |
          curl -fsSL https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate/archive/refs/heads/master.tar.gz | tar -xz -C /tmp
          TPL=/tmp/CTRPluginFramework-BlankTemplate-master
          cp -rn "$TPL/Includes" ./Includes || true
          [ -f 3gx.ld ] || cp "$TPL/3gx.ld" ./3gx.ld
          [ -f Makefile ] || cp "$TPL/Makefile" ./Makefile

      - name: Build .3gx plugin
        run: make -j$(nproc)

      - name: Upload .3gx artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc3ds-cheat-engine-3gx
          path: "*.3gx"
